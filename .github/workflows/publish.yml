name: Publish
on:
  workflow_call:
    inputs:
      release_ref:
        description: Tag or commit to publish
        required: false
        type: string
  workflow_dispatch:
    inputs:
      release_ref:
        description: Tag or commit to publish
        required: true
        type: string
  push:
    tags:
      - "*"
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win32
            arch: x64
          # - os: windows-latest
          #   platform: win32
          #   arch: ia32
          - os: windows-latest
            platform: win32
            arch: arm64
          - os: ubuntu-latest
            platform: linux
            arch: x64
          # - os: ubuntu-latest
          #   platform: linux
          #   arch: arm64
          # - os: ubuntu-latest
          #   platform: linux
          #   arch: armhf
          # - os: ubuntu-latest
          #   platform: alpine
          #   arch: x64
          - os: macos-26-intel
            platform: darwin
            arch: x64
          - os: macos-latest
            platform: darwin
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm
      - run: |
          npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - shell: pwsh
        run: echo "target=${{ matrix.platform }}-${{ matrix.arch }}" >> $env:GITHUB_ENV
      - run: npm run package:vsix -- --target ${{ env.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.target }}
          path: "*.vsix"

  # 成果物をダウンロードしてpublish
  publish:
    runs-on: ubuntu-latest
    needs: build
    if: success()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm
      # --ignore-scripts because this job only needs the vsce binary; the root
      # postinstall (napi binary download, client/server install) is unnecessary here.
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      - run: npm run publish:vsix -- --packagePath $(find . -iname *.vsix)
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
